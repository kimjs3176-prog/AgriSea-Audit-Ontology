# GitLab 미러: main·governance-log 를 기관 GitLab(gitlab.aigov.go.kr)에 그대로 밀어 넣는다(GitHub가 원본).
# 기관 GitLab은 GitHub 호스트 러너(해외)에서 접속되지 않는다(443 연결 시간 초과). 국내 PC(집·사무실)에서는 접속된다.
# 그 PC에 self-hosted 러너를 등록하고, 저장소 Variables 에 MIRROR_RUNNER 를 그 러너 라벨(예: self-hosted)로 지정한다.
# 러너를 둘 수 없으면 그 PC에서 scripts/mirror-gitlab.sh 를 주기적으로 돌린다.
# 저장소 Settings > Secrets and variables > Actions 에 GITLAB_TOKEN(write_repository) 을 등록해야 한다.
name: GitLab 미러
on:
  push:
    branches: [main, governance-log]
  # 자동 수집 워크플로가 GITHUB_TOKEN으로 푸시한 커밋은 push 이벤트를 만들지 않으므로 따로 받는다
  workflow_run:
    workflows: ["회의록 데이터 갱신"]
    types: [completed]
  workflow_dispatch:
concurrency: gitlab-mirror
jobs:
  mirror:
    runs-on: ${{ vars.MIRROR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    # Windows 러너도 Git Bash 로 같은 명령을 실행한다
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: GitLab 접속 확인
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then echo "::error::GITLAB_TOKEN secret이 없습니다."; exit 1; fi
          if ! curl -sS -o /dev/null --connect-timeout 15 https://gitlab.aigov.go.kr/; then
            echo "::error::이 러너(${RUNNER_NAME})에서 gitlab.aigov.go.kr 에 접속할 수 없습니다. 국내 PC의 self-hosted 러너를 Variables 의 MIRROR_RUNNER 로 지정하세요."
            exit 1
          fi
      - name: GitLab으로 푸시
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          url="https://oauth2:${GITLAB_TOKEN}@gitlab.aigov.go.kr/kimjs1408/kookgam-ax.git"
          for b in main governance-log; do
            git rev-parse -q --verify "origin/$b" >/dev/null && \
              git push "$url" "refs/remotes/origin/$b:refs/heads/$b"
          done
