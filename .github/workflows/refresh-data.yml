# 회의록 자동 수집: 열린국회정보 API로 농해수위 회의록을 모아 data/seed.sqlite3.gz 로 커밋한다.
# 커밋되면 Vercel이 새로 배포하면서 이 데이터를 싣는다(배포 환경의 저장소는 임시라서 이 방식으로 영구 보관).
#  - 하루 3번(07:17·13:17·19:17 KST) 실행: 저장된 마지막 회의일 7일 전부터 오늘까지 수집
#    (정각 예약은 GitHub 혼잡으로 2~4시간씩 늦게 시작돼 정각을 피함. 회의록이 낮에 올라와도 당일 반영)
#  - 국회 API 접속이 일부 날짜만 막히면 나머지는 저장하고 계속, 실행이 실패하면 이슈로 알림
#  - 초기 데이터가 없으면 22대 임기 시작일(2024-05-30)부터 전체 수집
#  - 수집 후 회의 요약·쟁점/기관 집계·관계망·지식그래프(data/kg.nq.gz, 추론 포함)를 미리 계산해 함께 커밋
#  - 내용이 바뀌었을 때만 커밋
# 저장소 Settings > Secrets and variables > Actions 에 ASSEMBLY_API_KEY 를 등록해야 한다.
name: 회의록 데이터 갱신

on:
  schedule:
    - cron: "17 22 * * *"   # 07:17 KST
    - cron: "17 4 * * *"    # 13:17 KST
    - cron: "17 10 * * *"   # 19:17 KST
  workflow_dispatch:
    inputs:
      date_from:
        description: "수집 시작일(YYYY-MM-DD). 비우면 자동(마지막 회의일 7일 전부터)"
        required: false
      date_to:
        description: "수집 종료일(YYYY-MM-DD). 비우면 오늘"
        required: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-data.yml"   # 이 워크플로가 처음 머지될 때 전체 수집 1회 실행
      # 분석 규칙(발언자 분류·쟁점 사전·요약 등)이 바뀌면 저장된 데이터를 다시 계산해 반영
      - "agrisea/lexicon.py"
      - "agrisea/parser.py"
      - "agrisea/nlp.py"
      - "agrisea/analysis.py"
      - "agrisea/precompute.py"
      - "agrisea/spacing.py"
      - "agrisea/members.py"
      - "agrisea/followup.py"
      - "agrisea/governance.py"
      - "agrisea/programs.py"
      - "agrisea/readable.py"
      - "agrisea/ontology.py"
      - "agrisea/reasoner.py"
      - "ontology/agrisea.ttl"

permissions:
  contents: write
  issues: write   # 실패 알림 이슈

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
      AGRISEA_DATA_DIR: ${{ github.workspace }}/var
      # 운영 관문 원장(governance-log 브랜치)의 최신 정책으로 이행 판정(G7 제도 반영)
      AGRISEA_GOVERNANCE_LEDGER: ${{ github.workspace }}/var/governance.jsonl
      # 회의록 PDF 서버는 해외(Actions) 접속이 막혀 있어 서울 리전 배포본을 거쳐 본문을 받는다.
      # 배포 주소가 바뀌면 저장소 Variables에 MINUTES_PROXY 로 지정.
      AGRISEA_MINUTES_PROXY: ${{ vars.MINUTES_PROXY || 'https://ax-rosy-seven.vercel.app/api/minutes-text' }}
      # 지원사업 공고(공공데이터포털 K-Startup). 해외 접속이 막히면 서울 리전 배포본의 /api/kstartup 을 거친다
      # (배포본에도 KSTARTUP_API_KEY 필요). 배포 주소가 바뀌면 Variables 에 KSTARTUP_PROXY 로 지정.
      KSTARTUP_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
      KSTARTUP_RELAY: ${{ vars.KSTARTUP_PROXY || 'https://ax-rosy-seven.vercel.app/api/kstartup' }}
    steps:
      # 이벤트 시점 커밋이 아니라 실행 시작 시점의 최신 브랜치를 받는다(앞선 실행이 커밋한 데이터를 이어받기 위함)
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 기존 데이터 불러오기
        run: |
          mkdir -p var
          if [ -f data/seed.sqlite3.gz ]; then gunzip -c data/seed.sqlite3.gz > var/agrisea.sqlite3; fi
          python -m agrisea stats

      - name: 수집
        env:
          DATE_FROM: ${{ inputs.date_from }}
          DATE_TO: ${{ inputs.date_to }}
        run: |
          if [ -z "$ASSEMBLY_API_KEY" ]; then echo "::error::ASSEMBLY_API_KEY secret이 없습니다."; exit 1; fi
          if [ -n "$DATE_FROM" ]; then
            python -m agrisea collect --from "$DATE_FROM" ${DATE_TO:+--to "$DATE_TO"} --fetch
          else
            python -m agrisea collect --resume ${DATE_TO:+--to "$DATE_TO"} --fetch
          fi
          python -m agrisea fetch-minutes   # 이전에 실패한 본문 재시도
          python -m agrisea stats

      - name: 지원사업 공고 수집(공공데이터포털)
        continue-on-error: true   # 공고 수집이 막혀도 회의록 갱신은 계속한다(저장된 공고 유지)
        run: |
          if [ -z "$KSTARTUP_API_KEY" ]; then echo "::warning::KSTARTUP_API_KEY secret이 없어 지원사업 공고 수집을 건너뜁니다."; exit 0; fi
          python -m agrisea programs || {
            echo "직접 접속 실패 → 서울 리전 배포본을 거쳐 다시 받습니다"
            KSTARTUP_PROXY="$KSTARTUP_RELAY" python -m agrisea programs
          } || { echo "::warning::지원사업 공고 수집 실패(이전 공고 유지)"; exit 1; }

      - name: 운영 관문 정책 받기(governance-log 브랜치)
        run: |
          (git fetch --depth=1 origin governance-log && git show origin/governance-log:governance/events.jsonl > var/governance.jsonl) \
            || { rm -f var/governance.jsonl; echo "원장 없음 → 초기 정책"; }

      - name: 사전 계산(요약·집계·지식그래프) 및 초기 데이터 내보내기
        run: |
          python -m agrisea export-seed
          ls -la data/

      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/   # 예전 data/kg.nt.gz 삭제도 함께 반영
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore(data): 농해수위 회의록 자동 수집 반영"
          # 그사이 다른 실행이 데이터를 커밋했으면, 방금 만든 데이터 파일을 우선해 다시 얹는다
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # G1 접수 증거: AI가 판정한 실행 기록(데이터 해시·정책 버전·경로별 건수)을 원장에 커밋
      - name: 운영 관문 실행 기록
        env:
          AGRISEA_GOV_GITHUB_REPO: ${{ github.repository }}
          AGRISEA_GOV_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m agrisea governance-run --trigger "자동 수집(${{ github.event_name }})" || echo "::warning::운영 관문 원장 기록 실패"

      - name: 실행 요약
        if: always()
        run: |
          {
            echo "### 회의록 데이터 갱신"
            python -m agrisea stats 2>/dev/null | sed 's/^/    /' || true
            if [ -f data/seed.meta.json ]; then echo; echo '```json'; cat data/seed.meta.json; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 예약 실행이 실패하면 이슈 하나에 모아 알린다(같은 제목의 열린 이슈가 있으면 댓글로 추가)
      - name: 실패 알림
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          retries: 3   # GitHub API 일시 오류(502) 대비
          script: |
            const title = "회의록 자동 수집 실패";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `자동 수집이 실패했습니다: ${url}\n\n국회 API 접속 장애(해외 접속 차단·시간 초과)이면 다음 예약 실행에서 대개 복구됩니다. ` +
                         `계속 실패하면 Actions에서 「회의록 데이터 갱신」을 수동 실행(Run workflow)하세요.`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", per_page: 50 });
            const found = open.find(i => i.title === title && !i.pull_request);
            if (found) await github.rest.issues.createComment({ ...context.repo, issue_number: found.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body });

      # 성공하면 열려 있는 실패 알림 이슈를 닫는다
      - name: 실패 알림 정리
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          retries: 3   # GitHub API 일시 오류(502) 대비
          script: |
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", per_page: 50 });
            for (const i of open.filter(i => i.title === "회의록 자동 수집 실패" && !i.pull_request)) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: "다음 자동 수집이 성공해 닫습니다." });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: "closed", state_reason: "completed" });
            }
