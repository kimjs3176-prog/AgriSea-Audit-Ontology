name: Sync to Public GitLab

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Public GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          # 대용량 파일(10MB 이상)이 히스토리에 있어 훅에 걸리는 경우 아래 주석을 해제하세요
          # git rm --cached -r *.zip || true
          git push --force https://oauth2:${GITLAB_TOKEN}@gitlab.aigov.go.kr/kimjs1408/kookgam-ax.git HEAD:main
